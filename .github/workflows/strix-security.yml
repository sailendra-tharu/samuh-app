name: Strix Security Scan

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:
  security-scan:
    name: Run Strix
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash

      - name: Run Strix
        env:
          STRIX_LLM: openai/muse-spark-1.3
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: https://api.meta.ai/v1
          STRIX_REASONING_EFFORT: medium
          LLM_TIMEOUT: "600"
          STRIX_LLM_MAX_RETRIES: "3"

        run: |
          strix \
            -n \
            -t ./ \
            --scan-mode quick \
            --scope-mode auto

      - name: Upload Strix results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strix-results
          path: strix_runs/
          if-no-files-found: ignore