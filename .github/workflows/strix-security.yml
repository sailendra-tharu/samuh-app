name: Strix Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  security-scan:
    name: Run Strix
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Install Strix
      # --------------------------------------------------
      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash

      # --------------------------------------------------
      # 3. Run Strix using Meta Model API / Muse Spark
      # --------------------------------------------------
      - name: Run Strix
        env:
          # Meta Model API is OpenAI-compatible
          STRIX_LLM: openai/muse-spark-1.3

          # Your Meta Model API key
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

          # Meta Model API endpoint
          LLM_API_BASE: https://api.meta.ai/v1

          # Optional Strix settings
          STRIX_REASONING_EFFORT: medium
          LLM_TIMEOUT: "600"
          STRIX_LLM_MAX_RETRIES: "3"

        run: |
          strix \
            -n \
            -t ./ \
            --scan-mode quick \
            --scope-mode auto

      # --------------------------------------------------
      # 4. Upload Strix results
      # --------------------------------------------------
      - name: Upload Strix results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strix-results
          path: strix_runs/
          if-no-files-found: ignore