name: Strix security scan

on:
  push:
    branches:
      - develop

  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  security-scan:
    name: AI security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Strix
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx install strix-agent
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Strix
        env:
          # override the default when a different provider/model is preferred.
          STRIX_LLM: ${{ secrets.STRIX_LLM || vars.STRIX_LLM || 'openai/gpt-5.4' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix \
            -n \
            -t ./ \
            --scan-mode quick \
            --scope-mode auto

      - name: Upload Strix results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strix-results
          path: strix_runs/
          if-no-files-found: ignore
